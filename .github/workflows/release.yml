# 打 tag（v*）：构建多平台单二进制挂到 GitHub Release，并把多架构镜像推到 Docker Hub。
# 也可在 Actions 页面手动触发（workflow_dispatch）：只推镜像，tag 为 dev。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 安全门禁：每次发布（含手动 dispatch）必过，任一失败即阻断发布。
  # govulncheck 按调用可达性报 Go 依赖漏洞（误报少）；pnpm audit 审前端依赖，high 及以上才拦。
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      # 不配 cache:pnpm——本 job 只跑 audit（读 lockfile，不 install），缓存 post 步会因无法保存而挂
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm --dir ./web audit --audit-level=high

  # 仅 tag 触发时才建 Release：手动触发跑在没有 tag 的分支上，创建 Release 会失败。
  release:
    needs: security
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build frontend
        run: |
          pnpm --dir ./web install --frozen-lockfile
          VERSION="${GITHUB_REF_NAME}" pnpm --dir ./web build
      - name: Build binaries
        run: |
          mkdir -p bin
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -ldflags="-s -w -X dockge/internal/version.Version=${GITHUB_REF_NAME}" \
              -o "bin/dockge-server-$os-$arch" ./cmd
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: bin/dockge-server-*
          generate_release_notes: true

  # 多架构镜像推 Docker Hub：homelab 大量 arm64（树莓派/NAS），单架构镜像会直接不可用。
  # 需在仓库 Settings → Secrets and variables → Actions 配置：
  #   secrets.DOCKERHUB_USERNAME / secrets.DOCKERHUB_TOKEN（Docker Hub 的 Access Token）
  #   vars.DOCKERHUB_IMAGE（可选，默认 makeshit/dockge）
  image:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || 'makeshit/dockge' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Docker Hub 页面的 overview：镜像推送不会携带仓库描述，必须经 Hub API 单独写入，
      # 否则页面恒为 "No overview available"。复用镜像推送的同名凭据与仓库名。
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_IMAGE || 'makeshit/dockge' }}
          readme-filepath: deploy/dockerhub-overview.md
