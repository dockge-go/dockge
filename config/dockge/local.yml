env: local
http:
  host: 127.0.0.1
  port: 5001
  # 外部可达地址（OIDC redirect 等用途）：反代/TLS 终止在外层时 MUST 配置，
  # 例如 https://dockge.example.com；留空回退 host:port 拼接（仅适合直连部署）。
  base_url: ""
ssl:
  cert: ""
  key: ""
security:
  jwt:
    key: change-me-for-local-development
  auth:
    mode: jwt
    proxy:
      trusted_proxies: []
      username_header: X-Forwarded-User
      auto_provision: true
dockge:
  stacks_dir: storage/stacks
data:
  db:
    user:
      dsn: storage/dockge.db
log:
  log_level: debug
  mode: console
  encoding: console
  log_file_name: "./storage/logs/dockge.log"
  max_backups: 30
  max_age: 7
  max_size: 1024
  compress: true
