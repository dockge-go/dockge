# 打 tag（v*）即发布：构建带版本号的多平台单二进制并挂到 GitHub Release。
# release 存在后，应用内「检查更新」（/version/check → releases 列表）即实际可用。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build frontend
        run: |
          pnpm --dir ./web install --frozen-lockfile
          VERSION="${GITHUB_REF_NAME}" pnpm --dir ./web build
      - name: Build binaries
        run: |
          mkdir -p bin
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -ldflags="-s -w -X dockge/internal/version.Version=${GITHUB_REF_NAME}" \
              -o "bin/dockge-server-$os-$arch" ./cmd
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: bin/dockge-server-*
          generate_release_notes: true

  # 多架构镜像推 Docker Hub：homelab 大量 arm64（树莓派/NAS），单架构镜像会直接不可用。
  # 需配置仓库 secrets：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN；
  # 镜像名可用仓库变量 DOCKERHUB_IMAGE 覆盖（默认 dockge-go/dockge）。
  image:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || 'dockge-go/dockge' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
