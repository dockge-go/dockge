apiVersion: apps/v1
kind: Deployment
metadata:
  name: dockge
  namespace: dockge
spec:
  replicas: 1
  # bbolt 与本机 Compose 只能由一个实例写入，更新时不能同时启动第二个 Pod。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dockge
  template:
    metadata:
      labels:
        app: dockge
    spec:
      automountServiceAccountToken: false
      # 在已安装 Docker Engine + 可用 socket 的选定节点上部署；不能漂移到其他主机。
      nodeSelector:
        dockge-runtime: "true"
      containers:
        - name: dockge
          image: makeshit/dockge:0.2.6
          # 固定支持两挂载布局的发布版本；升级时核对新版本或镜像摘要。
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
          envFrom:
            - configMapRef:
                name: dockge-config
            - secretRef:
                name: dockge-oidc
          volumeMounts:
            - name: stacks
              mountPath: /opt/stacks
            - name: runtime
              mountPath: /var/run/docker.sock
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 15
      volumes:
        - name: stacks
          hostPath:
            path: /opt/stacks
            type: DirectoryOrCreate
        - name: runtime
          hostPath:
            path: /var/run/docker.sock
            type: Socket
