env: local
http:
  host: 127.0.0.1
  port: 5001
ssl:
  cert: ""
  key: ""
security:
  jwt:
    key: change-me-for-local-development
container:
  # 容器运行时 CLI：auto（默认，按 PATH 探测 docker → podman → nerdctl）或显式指定
  cli: auto
  # compose 命令：留空 = `<cli> compose`；独立命令（如 podman-compose）可直接填写
  compose: ""
dockge:
  stacks_dir: storage/stacks
data:
  db:
    user:
      dsn: storage/dockge.db
log:
  log_level: debug
  mode: console
  encoding: console
  log_file_name: "./storage/logs/dockge.log"
  max_backups: 30
  max_age: 7
  max_size: 1024
  compress: true
