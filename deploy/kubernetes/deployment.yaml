apiVersion: apps/v1
kind: Deployment
metadata:
  name: dockge
  namespace: dockge
spec:
  replicas: 1
  # bbolt 与本机 Compose 只能由一个实例写入，更新时不能同时启动第二个 Pod。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dockge
  template:
    metadata:
      labels:
        app: dockge
    spec:
      automountServiceAccountToken: false
      # 在已安装 Docker Engine + 可用 socket 的选定节点上部署；不能漂移到其他主机。
      nodeSelector:
        dockge-runtime: "true"
      containers:
        - name: dockge
          image: ghcr.io/dockge-go/dockge:0.2.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
          envFrom:
            - configMapRef:
                name: dockge-config
            - secretRef:
                name: dockge-oidc
          volumeMounts:
            - name: stacks
              mountPath: /opt/stacks
            - name: data
              mountPath: /app/data
            - name: runtime
              mountPath: /var/run/docker.sock
            # 仅只读挂载固定统计文件，不暴露节点 procfs 或根目录。
            - name: host-metric-0
              mountPath: /host/proc/stat
              readOnly: true
            - name: host-metric-1
              mountPath: /host/proc/meminfo
              readOnly: true
            - name: host-metric-2
              mountPath: /host/proc/cpuinfo
              readOnly: true
            - name: host-metric-3
              mountPath: /host/proc/loadavg
              readOnly: true
            - name: host-metric-4
              mountPath: /host/proc/uptime
              readOnly: true
            - name: host-metric-5
              mountPath: /host/proc/sys/kernel/osrelease
              readOnly: true
            - name: host-metric-6
              mountPath: /host/etc/os-release
              readOnly: true
            - name: host-metric-7
              mountPath: /host/etc/hostname
              readOnly: true
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 15
      volumes:
        - name: host-metric-0
          hostPath:
            path: /proc/stat
            type: File
        - name: host-metric-1
          hostPath:
            path: /proc/meminfo
            type: File
        - name: host-metric-2
          hostPath:
            path: /proc/cpuinfo
            type: File
        - name: host-metric-3
          hostPath:
            path: /proc/loadavg
            type: File
        - name: host-metric-4
          hostPath:
            path: /proc/uptime
            type: File
        - name: host-metric-5
          hostPath:
            path: /proc/sys/kernel/osrelease
            type: File
        - name: host-metric-6
          hostPath:
            path: /etc/os-release
            type: File
        - name: host-metric-7
          hostPath:
            path: /etc/hostname
            type: File
        - name: stacks
          hostPath:
            path: /opt/stacks
            type: DirectoryOrCreate
        - name: data
          hostPath:
            path: /var/lib/dockge
            type: DirectoryOrCreate
        - name: runtime
          hostPath:
            path: /var/run/docker.sock
            type: Socket
