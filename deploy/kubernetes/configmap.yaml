apiVersion: v1
kind: ConfigMap
metadata:
  name: dockge-config
  namespace: dockge
data:
  DOCKGE_OIDC_ENABLED: "true"
  # 必须替换为实际提供方 issuer；不是授权端点或 token 端点。
  DOCKGE_OIDC_ISSUER: "https://identity.example.com/realms/main"
  DOCKGE_OIDC_CLIENT_ID: "dockge"
  # 必须与提供方登记值完全一致，公网部署必须使用 HTTPS。
  DOCKGE_OIDC_REDIRECT_URL: "https://dockge.example.com/v1/auth/oidc/callback"
