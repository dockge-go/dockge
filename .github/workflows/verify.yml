name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build and test
        run: |
          set +e
          make verify 2>&1 | tee "$RUNNER_TEMP/dockge-verify.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/dockge-verify.log" <<'PYTHON'
          import re, sys
          from pathlib import Path
          text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", Path(sys.argv[1]).read_text(errors="replace"))
          lines = text.splitlines()
          errors = [line for line in lines if re.search(r"--- FAIL:|_test\.go:\d+|Makefile:|ERR_PNPM|error:|fatal:|panic:|FAIL\s", line, re.I)]
          for line in (errors or lines[-20:])[-40:]:
              print("::error::" + line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PYTHON
            exit "$status"
          fi
      - name: Vet and race tests
        run: |
          go vet ./...
          go test -race ./internal/repository ./internal/service ./internal/server
      - name: Dependency security
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          pnpm --dir ./web audit --audit-level=high --registry=https://registry.npmjs.org
