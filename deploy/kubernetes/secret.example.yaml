# 仅为配置结构示例，禁止将生产凭据提交到版本控制。
apiVersion: v1
kind: Secret
metadata:
  name: dockge-oidc
  namespace: dockge
type: Opaque
stringData:
  # 独立的随机签名密钥，不能复用 OIDC 客户端密钥，也不能保留项目默认值。
  DOCKGE_SECURITY_JWT_KEY: "替换为独立生成的至少32字节随机密钥"
  DOCKGE_OIDC_CLIENT_SECRET: "替换为真实客户端密钥"
  # 使用 ID Token 中的稳定 sub，不是邮箱或可变用户名。只允许这个身份。
  DOCKGE_OIDC_SUBJECT: "替换为唯一允许身份的sub"
