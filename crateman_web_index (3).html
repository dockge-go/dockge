    var stored = null;
    try { stored = localStorage.getItem('dockge.theme'); } catch (e) {}
    if (stored !== 'dark' && stored !== 'light') {
      stored = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = stored;
  })();

  <script>
(function() {

  const t = window.__t;

  // ─── Mock Data ──────────────────────────────────────────────────────────

    { Id: 'sha256:jkl012', RepoTags: ['crate/worker:latest'], Repository: 'crate/worker', Size: 245000000, Created: Date.now() - 345600000, system: false },
    { Id: 'sha256:mno345', RepoTags: ['prom/prometheus:latest'], Repository: 'prom/prometheus', Size: 256000000, Created: Date.now() - 432000000, system: true },
    { Id: 'sha256:pqr678', RepoTags: ['crate/api:3.2.1'], Repository: 'crate/api', Size: 198000000, Created: Date.now() - 518400000, system: false },
    { Id: 'sha256:stu901', RepoTags: ['alpine:3.19'], Repository: 'alpine', Size: 7800000, Created: Date.now() - 604800000, system: false },
    { Id: 'sha256:vwx234', RepoTags: ['node:20-slim'], Repository: 'node', Size: 267000000, Created: Date.now() - 691200000, system: false },
  ];

  const MOCK_VOLUMES = [
    { Name: 'postgres_data', Driver: 'local', Mountpoint: '/var/lib/postgresql/data', Usage: '2.1GB', system: false },
    { Name: 'redis_data', Driver: 'local', Mountpoint: '/var/lib/redis', Usage: '128MB', system: true },

  const MOCK_NETWORKS = [

    { ID: 'net002', Name: 'host', Driver: 'host', Subnet: '—', Containers: 1, system: true },
    { ID: 'net003', Name: 'app_frontend', Driver: 'bridge', Subnet: '172.18.0.0/16', Containers: 2, system: false },
    { ID: 'net004', Name: 'app_backend', Driver: 'bridge', Subnet: '172.19.0.0/16', Containers: 2, system: false },
  ];

  const MOCK_STACKS = [
    { id: 'stack-1', name: 'web-app', compose_path: '/opt/stacks/web-app/compose.yaml', status: 'up', containers: 4, created: Date.now() - 86400000,
      compose: 'services:\n  web:\n    image: nginx:latest\n    ports:\n      - "8080:80"\n    volumes:\n      - ./html:/usr/share/nginx/html\n  api:\n    image: crate/api:3.2.1\n    ports:\n      - "3000:3000"\n    environment:\n      - DATABASE_URL=postgres://db\n  db:\n    image: postgres:16\n    volumes:\n      - pg_data:/var/lib/postgresql/data\n\nvolumes:\n  pg_data:' },
    { id: 'stack-2', name: 'monitoring', compose_path: '/opt/stacks/monitoring/compose.yaml', status: 'down', containers: 2, created: Date.now() - 172800000,
      compose: 'services:\n  prometheus:\n    image: prom/prometheus:latest\n    ports:\n      - "9090:9090"\n  grafana:\n    image: grafana/grafana:latest\n    ports:\n      - "3001:3000"' },
  ];

  // 数据契约：资源清单通过 REST 获取；容器状态、主机状态与日志分别使用专用长连接。
  const state = {
    route: 'dashboard',
    containers: MOCK_CONTAINERS,
    images: MOCK_IMAGES,
    volumes: MOCK_VOLUMES,
    networks: MOCK_NETWORKS,
    stacks: MOCK_STACKS,
    filters: { containers: { all: false } },
    pagination: { containers: 1, images: 1, volumes: 1, networks: 1, stacks: 1 },
    selectedStack: null,
    detailContainerId: null,
  };

  // ─── Helpers ────────────────────────────────────────────────────────────
  function formatBytes(b) {
    if (!b) return '0 B';
    const k = 1024, s = ['B','KB','MB','GB','TB'];
    const i = Math.floor(Math.log(b)/Math.log(k));
    return parseFloat((b/Math.pow(k,i)).toFixed(1)) + ' ' + s[i];
  }
  function timeAgo(ms) {
    if (!ms) return '—';
    const s = Math.floor((Date.now()-ms)/1000);
    if (s < 60) return t('common.secAgo', {n: s});
    if (s < 3600) return t('common.minAgo', {n: Math.floor(s/60)});
    if (s < 86400) return t('common.hourAgo', {n: Math.floor(s/3600)});
    return t('common.dayAgo', {n: Math.floor(s/86400)});
  }
  function shortId(id) { return id.slice(0,12); }
  function trName(n) { return (n||'').replace(/^\//,'').split('/').pop(); }
  function parsePorts(ports) {
    if (!ports) return [];
    return ports.map(p => p.PrivatePort ? (p.PublicPort ? `${p.IP||''}${p.PublicPort}:${p.PrivatePort}` : `${p.PrivatePort}`) : '').filter(Boolean);
  }
  function ctrStatus(c) {
    if (c.State === 'running') return 'running';
    if (c.State === 'paused') return 'paused';
    return 'exited';
  }
  function ctrStatusLabel(c) {
    return { running:t('status.running'), exited:t('status.exited'), paused:t('status.paused'), dead:t('status.dead') }[c.State] || c.State;
  }
  function ctrStatusText(c) {
    if (c.State === 'running') return t('status.upHours', { n: c.upHours || 1 });
    if (c.State === 'paused') return t('status.paused');
    if (c.exitMinAgo != null) return t('status.exitedDetail', { code: c.exitCode || 0, m: c.exitMinAgo });
    return t('status.exitedHours', { code: c.exitCode || 0, n: c.exitHoursAgo || 1 });
  }
  function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

  // ─── Pagination ─────────────────────────────────────────────────────────
  const PAGE_SIZE = 15;
  function paginate(arr, key) {
    const total = arr.length;
    const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    let page = state.pagination[key] || 1;
    if (page > pages) { page = pages; state.pagination[key] = page; }
    return { slice: arr.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE), page, pages, total };
  }
  function paginationHtml(key, pg) {
    if (pg.pages <= 1) return '';
    return `<div class="pagination">
      <button class="pg-btn" onclick="gotoPage('${key}',${pg.page-1})" aria-label="${t('pg.prev')}" ${pg.page<=1?'disabled':''}>‹</button>
      <span>${t('pg.info',{p:pg.page,n:pg.pages,t:pg.total})}</span>
      <button class="pg-btn" onclick="gotoPage('${key}',${pg.page+1})" aria-label="${t('pg.next')}" ${pg.page>=pg.pages?'disabled':''}>›</button>
    </div>`;
  }
  function gotoPage(key, p) { state.pagination[key] = p; renderCurrentView(); }

  // ─── Toast ──────────────────────────────────────────────────────────────
  function toast(msg, type='info') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity 200ms'; setTimeout(()=>el.remove(),200); }, 3500);
  }

  // ─── iOS-style Confirm / Input Dialog ───────────────────────────────────
  let dialogCallback = null;
  const dialogOverlay = () => document.getElementById('dialog-overlay');
  const dialogInputEl = () => document.getElementById('dialog-input');
  function confirmDialog(message, onConfirm) {
    dialogInputEl().style.display = 'none';
    document.getElementById('dialog-message').textContent = message;
    document.getElementById('dialog-cancel').textContent = t('common.cancel');
    document.getElementById('dialog-ok').textContent = t('common.ok');
    document.getElementById('dialog-ok').classList.add('destructive');
    dialogCallback = onConfirm;
    dialogOverlay().classList.add('open');
    document.getElementById('dialog-ok').focus();
  }
  function dialogInput(message, placeholder, onSubmit) {
    const input = dialogInputEl();
    input.style.display = '';
    input.value = '';
    input.placeholder = placeholder || '';
    document.getElementById('dialog-message').textContent = message;
    document.getElementById('dialog-cancel').textContent = t('common.cancel');
    document.getElementById('dialog-ok').textContent = t('stack.create');
    document.getElementById('dialog-ok').classList.remove('destructive');
    dialogCallback = function () { const v = input.value.trim(); if (v) onSubmit(v); };
    dialogOverlay().classList.add('open');
    input.focus();
  }
  function closeDialog() {
    dialogOverlay().classList.remove('open');
    dialogCallback = null;
  }
  document.getElementById('dialog-cancel').addEventListener('click', closeDialog);
  document.getElementById('dialog-ok').addEventListener('click', function () {
    var cb = dialogCallback;
    closeDialog();
    if (cb) cb();
  });
  dialogInputEl().addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('dialog-ok').click(); }
  });
  document.getElementById('dialog-overlay').addEventListener('click', function (e) {
    if (e.target === e.currentTarget) closeDialog();
  });

  // ─── Sheet ──────────────────────────────────────────────────────────────
  function openSheet(title, body, footer='') {
    document.getElementById('sheet-title').textContent = title;
    document.getElementById('sheet-body').innerHTML = body;
    document.getElementById('sheet-footer').innerHTML = footer;
    document.getElementById('sheet-overlay').classList.add('open');
  }
  function closeSheet() { document.getElementById('sheet-overlay').classList.remove('open'); }
  document.getElementById('sheet-close').addEventListener('click', closeSheet);
  document.getElementById('sheet-overlay').addEventListener('click', e => { if(e.target===e.currentTarget) closeSheet(); });

  // ─── Mobile Nav ─────────────────────────────────────────────────────────
  const sidebarEl = document.querySelector('.sidebar');
  const backdropEl = document.getElementById('sidebar-backdrop');
  const hamburgerBtn = document.getElementById('hamburger-btn');

  function openSidebar() {
    sidebarEl.classList.add('open');
    backdropEl.classList.add('open');
    hamburgerBtn.setAttribute('aria-expanded', 'true');
  }
  function closeSidebar() {
    sidebarEl.classList.remove('open');
    backdropEl.classList.remove('open');
    hamburgerBtn.setAttribute('aria-expanded', 'false');
  }
  hamburgerBtn.addEventListener('click', () => {
    sidebarEl.classList.contains('open') ? closeSidebar() : openSidebar();
  });
  backdropEl.addEventListener('click', closeSidebar);

  // ─── System Badge Helper ──────────────────────────────────────────────
  const lockSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
  function sysBadge(c) { return c.system ? `<span class="badge-system">${lockSvg} ${t('common.system')}</span>` : ''; }
  function rowCls(c) { return c.system ? ' class="row-system"' : ''; }

  // ─── Views ──────────────────────────────────────────────────────────────
  function renderDashboard() {
    const running = state.containers.filter(c=>c.State==='running').length;
    const stopped = state.containers.filter(c=>c.State==='exited').length;
    const paused = state.containers.filter(c=>c.State==='paused').length;

    // 行操作键收敛为 日志/终端/启停；重启与删除在详情 footer，整行点击即详情
    const renderRow = (c) => {
      const s=ctrStatus(c), ports=parsePorts(c.Ports);
      const isSys = c.system;
      const logBtn = `<button class="btn-icon" style="color:var(--accent)" title="${t('tab.logs')}" onclick="event.stopPropagation();showContainerLogs('${esc(c.Id)}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></button>`;
      const termBtn = `<button class="btn-icon" style="color:var(--success)" title="${t('tab.exec')}" onclick="event.stopPropagation();showContainerTerminal('${esc(c.Id)}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></button>`;
      const toggleBtn = s==='running'
        ? `<button class="btn-icon" onclick="event.stopPropagation();doAction('${c.Id}','stop')" title="${t('act.stop')}"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></button>`
        : `<button class="btn-icon" onclick="event.stopPropagation();doAction('${c.Id}','start')" title="${t('act.start')}"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>`;
      const actBtns = isSys ? `<span class="badge-system">${lockSvg} ${t('common.system')}</span>` : `${logBtn}${termBtn}${toggleBtn}`;
      return `<tr${rowCls(c)} onclick="${isSys?'':`openContainerDetail('${c.Id}')`}" tabindex="0" onkeydown="if(event.key==='Enter')${isSys?'':`openContainerDetail('${c.Id}')`}" style="${isSys?'pointer-events:none':''}">
        <td><div style="font-weight:500">${esc(trName(c.Names[0]))} ${sysBadge(c)}</div><div style="font-size:var(--text-xs);color:var(--muted);font-family:var(--font-mono)">${shortId(c.Id)}</div></td>
        <td><span class="status-badge status-${s}">${ctrStatusLabel(c)}</span>${s==='running'?'<span class="live-dot" title="'+t('common.live')+'"></span>':''}</td>
        <td><span style="font-size:var(--text-sm)">${esc(trName(c.Image))}</span></td>
        <td><span style="font-size:var(--text-xs);color:var(--muted)">${ports.join(', ')||'—'}</span></td>
        <td><span style="font-size:var(--text-xs);color:var(--muted)">${esc(ctrStatusText(c))}</span></td>
        <td onclick="event.stopPropagation()" style="${isSys?'pointer-events:auto':''}"><div style="display:flex;gap:2px">${actBtns}</div></td></tr>`;
    };
    if (!all) {
      const pg = paginate(state.containers.filter(c=>c.State==='running'), 'containers');
      const rows = pg.slice.map(c=>renderRow(c)).join('');
      return `<div class="view-section">
        <div class="section-header">
          <div><h2 class="section-title">${t('ctn.title')} <span class="live-dot"></span></h2><p class="section-subtitle">${t('common.totalRunning',{total:state.containers.length,running})}</p></div>
          <div style="display:flex;gap:var(--space-3);align-items:center">
            <button class="btn-clear" onclick="clearStoppedContainers()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg> ${t('ctn.clearStopped',{n:stoppedNonSys})}</button>
            <label class="switch-row"><span class="switch"><input type="checkbox" ${all?'checked':''} onchange="toggleAll(this.checked)" aria-label="${t('ctn.showAll')}" /></span> ${t('ctn.showAll')}</label>
            <button class="btn btn-primary" onclick="showNewContainerSheet()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> ${t('ctn.new')}</button>
          </div>
        </div>
        <table class="data-table"><thead><tr><th>${t('common.name')}</th><th>${t('common.status')}</th><th>${t('common.image')}</th><th>${t('common.ports')}</th><th>${t('common.uptime')}</th><th style="width:120px">${t('common.actions')}</th></tr></thead><tbody>${rows}</tbody></table>
        ${paginationHtml('containers', pg)}
      </div>`;
    }
    const pg = paginate(state.containers, 'containers');
    const rows = pg.slice.map(c => renderRow(c)).join('');
    return `<div class="view-section">
      <div class="section-header">
        <div><h2 class="section-title">${t('ctn.title')} <span class="live-dot"></span></h2><p class="section-subtitle">${t('common.totalRunning',{total:state.containers.length,running})}</p></div>
        <div style="display:flex;gap:var(--space-3);align-items:center">
          <button class="btn-clear" onclick="clearStoppedContainers()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg> ${t('ctn.clearStopped',{n:stoppedNonSys})}</button>
          <label class="switch-row"><span class="switch"><input type="checkbox" ${all?'checked':''} onchange="toggleAll(this.checked)" aria-label="${t('ctn.showAll')}" /></span> ${t('ctn.showAll')}</label>
          <button class="btn btn-primary" onclick="showNewContainerSheet()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> ${t('ctn.new')}</button>
        </div>
      </div>
      <table class="data-table"><thead><tr><th>${t('common.name')}</th><th>${t('common.status')}</th><th>${t('common.image')}</th><th>${t('common.ports')}</th><th>${t('common.uptime')}</th><th style="width:120px">${t('common.actions')}</th></tr></thead><tbody>${rows}</tbody></table>
      ${paginationHtml('containers', pg)}
    </div>`;
  }

  function defaultComposeYaml(name) {
    return `services:\n  app:\n    image: nginx:latest\n    ports:\n      - "8080:80"`;
  }

  // ─── Stacks Workbench (split layout, per original Dockge) ──────────────
  function renderStacks() {
    const pg = paginate(state.stacks, 'stacks');
    const items = pg.slice.map(s => `
      <button class="stack-item ${state.selectedStack===s.id?'active':''}" onclick="selectStack('${esc(s.id)}')">
        <span class="stack-item-dot ${s.status==='up'?'up':''}"></span>${esc(s.name)}
      </button>`).join('');
    const sel = state.stacks.find(x=>x.id===state.selectedStack);
    return `<div class="view-section" style="max-width:1400px">
      <div class="stacks-split">
        <div class="stack-list">
          <div class="stack-list-head"><button class="btn btn-primary" onclick="createStack()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> ${t('stack.new')}</button></div>
          <div class="stack-list-body">${items || `<div style="padding:var(--space-3);color:var(--muted);font-size:var(--text-sm)">${t('stack.emptyTitle')}</div>`}</div>
          ${paginationHtml('stacks', pg)}
        </div>
        ${sel ? renderStackWorkbench(sel) : `<div class="workbench"><div class="wb-empty">${t('stack.noSelection')}</div></div>`}
      </div>
    </div>`;
  }

  function renderStackWorkbench(s) {
    const services = stackServices(s).map(svc => ({ ...svc, status: s.status==='up' ? 'running' : 'exited' }));
    const pills = services.map(svc => `
      <button class="service-pill" title="${t('stack.viewServiceLogs')}" onclick="showServiceLogs('${esc(s.name)}','${esc(svc.name)}')">
        <span class="dot ${svc.status==='running'?'':'down'}"></span>${esc(svc.name)}
      </button>`).join('');
    const composeYaml = s.compose != null ? s.compose : defaultComposeYaml(s.name);
    const lineNums = composeYaml.split('\n').map((_,i) => i+1).join('\n');
    const deployLog = (s._deployLog && s._deployLog.length)
      ? s._deployLog.map(l => `<div>${l.startsWith('$') ? `<span class="t-dim">${esc(l)}</span>` : esc(l)}</div>`).join('')
      : `<div class="t-dim">$ ${t('stack.termHint')}</div>`;
    return `<div class="workbench">
      <div class="wb-head">
        <span class="wb-title">${esc(s.name)}</span>
        <span class="status-badge ${s.status==='up'?'status-running':'status-exited'}">${s.status==='up'?t('status.running'):t('status.stopped')}</span>
        <div class="wb-actions">
          <button class="btn btn-secondary" onclick="showStackLogs('${esc(s.id)}')">${t('stack.viewServiceLogs')}</button>
          <button class="btn btn-secondary" onclick="doStackAction('${esc(s.id)}','${s.status}')">${s.status==='up'?t('act.stop'):t('act.start')}</button>
          <button class="btn btn-danger" onclick="removeStack('${esc(s.id)}')">${t('common.delete')}</button>
          <button class="btn btn-primary" onclick="deployStack('${esc(s.id)}')">${t('stack.deploy')}</button>
        </div>
      </div>
      <div class="wb-services">${pills}</div>
      <div class="wb-editor">
        <div class="editor-toolbar" id="editor-toolbar-${s.id}">
          <button class="btn btn-ghost" onclick="editorValidate('${s.id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg> ${t('stack.validate')}</button>
          <button class="btn btn-ghost" onclick="editorFormat('${s.id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="21" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="3" y2="18"/></svg> ${t('stack.format')}</button>
          <button class="btn btn-ghost" id="editor-fullscreen-btn-${s.id}" onclick="editorFullscreen('${s.id}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg> ${t('stack.fullscreen')}</button>
        </div>
        <div class="editor-wrap" id="editor-wrap-${s.id}">
          <div class="editor-lines" id="editor-lines-${s.id}">${esc(lineNums)}</div>
          <textarea class="editor-textarea" id="editor-ta-${s.id}" rows="10" spellcheck="false" oninput="editorSyncLines('${s.id}')">${esc(composeYaml)}</textarea>
          <div class="editor-preview" id="editor-preview-${s.id}"></div>
        </div>
      </div>
      <div class="wb-terminal" id="wb-terminal">${deployLog}</div>
    </div>`;
  }

  function selectStack(id) { state.selectedStack = id; renderCurrentView(); }

  function createStack() {
    dialogInput(t('stack.createTitle'), t('stack.namePh'), function (name) {
      const s = {
        id: 'stack-' + Date.now(), name,
        compose_path: '/opt/stacks/' + name + '/compose.yaml',
        status: 'down', containers: 0, created: Date.now(),
        compose: defaultComposeYaml(name)
      };
      state.stacks.unshift(s);
      state.pagination.stacks = 1;
      state.selectedStack = s.id;
      renderCurrentView();
      toast(t('toast.createdStack'), 'success');
    });
  }

  function deployStack(id) {
    const s = state.stacks.find(x=>x.id===id);
    if (!s) return;
    const ta = document.getElementById('editor-ta-' + id);
    if (ta) s.compose = ta.value; // 部署前把编辑器内容落回栈数据
    const term = document.getElementById('wb-terminal');
    if (!term) return;
    const svc = stackServices(s);
    const log = [
      '$ docker compose up -d',
      '[+] Running ' + (svc.length + 1) + '/' + (svc.length + 1),
      ' ⠿ Network ' + s.name + '_default  Created'
    ].concat(svc.map(x => ' ⠿ Container ' + s.name + '-' + x.name + '-1  Started'));
    s._deployLog = [];
    term.innerHTML = '';
    toast(t('toast.deployStarted'), 'info');
    log.forEach((line, i) => {
      setTimeout(() => {
        s._deployLog.push(line);
        term.insertAdjacentHTML('beforeend', '<div>' + (line.startsWith('$') ? '<span class="t-dim">' + esc(line) + '</span>' : esc(line)) + '</div>');
        term.scrollTop = term.scrollHeight;
        if (i === log.length - 1) {
          s.status = 'up';
          renderCurrentView();
          toast(t('toast.deployDone'), 'success');
        }
      }, 280 * (i + 1));
    });
  }

  function renderImages() {
    if (!state.images.length) return `<div class="view-section"><div class="section-header"><div><h2 class="section-title">${t('img.title')}</h2><p class="section-subtitle">${t('img.subtitle')}</p></div><button class="btn btn-primary" onclick="showPullImageSheet()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> ${t('img.pull')}</button></div><div class="empty-state"><div class="empty-state-title">${t('img.emptyTitle')}</div></div></div>`;
    const unusedCount = state.images.filter(i=>!i.system).length;
    const pg = paginate(state.images, 'images');
    const rows = pg.slice.map(img => {
      const isSys = img.system;
      return `<tr${rowCls(img)}>
        <td><div style="font-weight:500">${esc(trName(img.Repository||img.RepoTags?.[0]?.split(':')[0]))} ${sysBadge(img)}</div><div style="font-size:var(--text-xs);color:var(--muted);font-family:var(--font-mono)">${shortId(img.Id)}</div></td>
        <td><span style="font-size:var(--text-sm)">${esc(img.RepoTags?.[0]||'<missing>')}</span></td>
        <td><span style="font-size:var(--text-sm);color:var(--muted)">${formatBytes(img.Size)}</span></td>
        <td><span style="font-size:var(--text-xs);color:var(--muted)">${timeAgo(img.Created)}</span></td>
        <td onclick="event.stopPropagation()">${isSys?'<span class="badge-system">'+lockSvg+' '+t('common.system')+'</span>':`<button class="btn-icon" onclick="event.stopPropagation();showImageHistory('${esc(img.Id)}')" title="${t('img.history')}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></button><button class="btn-icon" onclick="event.stopPropagation();showTagImageSheet('${esc(img.Id)}','${esc(img.RepoTags?.[0]||'')}')" title="${t('common.tag')}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></button><button class="btn-icon" style="color:var(--danger)" onclick="event.stopPropagation();removeImage('${esc(img.Id)}')" title="${t('common.remove')}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>`}</td>

  // ─── Router ─────────────────────────────────────────────────────────────
  const viewRenderers = { dashboard: renderDashboard, containers: renderContainers, stacks: renderStacks, images: renderImages, volumes: renderVolumes, networks: renderNetworks, sysinfo: renderSysInfo, sysdf: renderSysDf, settings: renderSettings, 'container-detail': renderContainerDetail };
  function topbarTitle(route) {
    if (route === 'container-detail') {
      const c = state.containers.find(x=>x.Id===state.detailContainerId);
      return c ? trName(c.Names[0]) : t('nav.containers');
    }
    return t('nav.' + route) || route;
  }

  function navigateTo(route) {
    state.route = route;
    const navRoute = route === 'container-detail' ? 'containers' : route;
    document.querySelectorAll('.nav-item').forEach(el => { el.classList.toggle('active', el.dataset.route===navRoute); el.removeAttribute('aria-current'); });
    const active = document.querySelector(`.nav-item[data-route="${navRoute}"]`);
    if (active) active.setAttribute('aria-current','page');
    document.getElementById('page-title').textContent = topbarTitle(route);
    const area = document.getElementById('content-area');
    area.classList.add('nav-anim');  // 仅导航播放视图过渡；轮询/操作刷新走 renderCurrentView 不触发
    area.innerHTML = viewRenderers[route]();
  }
  function refreshTopbarTitle() { document.getElementById('page-title').textContent = topbarTitle(state.route); }
  window.refreshTopbarTitle = refreshTopbarTitle;

  // ─── Actions ────────────────────────────────────────────────────────────
  function doAction(id, action) {
    toast(t('toast.actionSent', { action: t('act.' + action), id: shortId(id) }), 'success');
    const c = state.containers.find(x=>x.Id===id);
    if (c) {
      c.State = action==='start'?'running':action==='stop'?'exited':c.State;
      if (action === 'start') c.upHours = c.upHours || 1;
      if (action === 'stop') { c.exitCode = 0; c.exitMinAgo = 1; }
    }
    renderCurrentView();
  }
  function doRemove(id) {
    confirmDialog(t('confirm.removeContainer'), function () {
      state.containers = state.containers.filter(c=>c.Id!==id);
      toast(t('toast.containerRemoved'), 'success');
      updateNavCounts();
      renderCurrentView();
    });
  }
  function doStackAction(id, currentStatus) {
    const s = state.stacks.find(x=>x.id===id);
    if (!s) return;
    if (currentStatus === 'up') {
      s.status = 'down';
      toast(t('toast.stackStopped', { name: s.name }), 'info');
    } else {
      s.status = 'up';
      toast(t('toast.stackStarted', { name: s.name }), 'success');
    }
    renderCurrentView();
  }
  function removeStack(id) {
    confirmDialog(t('confirm.removeStack'), function () {
      state.stacks = state.stacks.filter(s=>s.id!==id);
      if (state.selectedStack === id) state.selectedStack = null;
      toast(t('toast.stackRemoved'), 'success');
      renderCurrentView();
    });
  }

  function toggleAll(v) { state.filters.containers.all = v; state.pagination.containers = 1; renderCurrentView(); }
  function sysdfPruneAll() {
    confirmDialog(t('confirm.pruneAll'), function () { toast(t('toast.prunedAll'), 'success'); });
  }
  function sysdfPrune(label) {
    confirmDialog(t('confirm.pruneAll'), function () { toast(t('toast.pruned', { v: label }), 'success'); });
  }
  function refreshAll() { toast(t('toast.refreshed'), 'info'); updateNavCounts(); renderCurrentView(); }
  function renderCurrentView() { const area = document.getElementById('content-area'); area.classList.remove('nav-anim'); area.innerHTML = viewRenderers[state.route](); }

    const stopped = state.containers.filter(c=>c.State==='exited'&&!c.system);
    if (!stopped.length) return toast(t('toast.noStopped'),'info');
    confirmDialog(t('confirm.removeStopped',{n:stopped.length}), function () {
      state.containers = state.containers.filter(c=>!(c.State==='exited'&&!c.system));
      toast(t('toast.removedCount',{n:stopped.length}), 'success');
      updateNavCounts(); renderCurrentView();
    });
  }

    state.images = state.images.filter(i=>i.Id!==id);
    toast(t('toast.imageRemoved'),'success'); updateNavCounts(); renderCurrentView();
  }

    const unused = state.images.filter(i=>!i.system);
    if (!unused.length) return toast(t('toast.noImages'),'info');
    confirmDialog(t('confirm.removeImages',{n:unused.length}), function () {
      state.images = state.images.filter(i=>i.system);
      toast(t('toast.imagesRemoved',{n:unused.length}), 'success'); updateNavCounts(); renderCurrentView();

  function stackServices(stack) {
    // 仅解析 services: 段下的直接子键（两空格缩进），遇下一个顶层键（如 volumes:）即止
    const yaml = stack.compose != null ? stack.compose : defaultComposeYaml(stack.name);
    const lines = yaml.split('\n');
    const names = [];
    let inServices = false;
    for (const line of lines) {
      if (/^services:\s*$/.test(line)) { inServices = true; continue; }
      if (inServices) {
        const m = line.match(/^ {2}([A-Za-z0-9_-]+):\s*$/);
        if (m) { names.push(m[1]); continue; }
        if (/^\S/.test(line)) break; // 下一个顶层键，services 段结束
      }
    }
    return names.map(n => ({ name: n }));
  }
  function showStackLogs(id) {
    const s = state.stacks.find(x=>x.id===id);
    if (!s) return;
    const aggregated = stackServices(s)
      .map(svc => SERVICE_LOGS[svc.name] || t('toast.noLogs', { name: svc.name }))
      .join('\n\n');
    const body = '<div class="log-only-viewer">' + esc(aggregated) + '</div>';
    openSheet(t('sheet.logsTitle', { name: s.name }), body, '<button class="btn btn-secondary" onclick="closeSheet()">' + t('common.close') + '</button>');
  }

  function commitContainer(id) {
    const c = state.containers.find(x=>x.Id===id);
    if (!c) return;
    const name = prompt(t('prompt.imageTag'), trName(c.Image) + ':latest');
    if (!name) return;
    state.images.push({
      Id: 'sha256:' + Math.random().toString(36).slice(2,10),
      Repository: name.split(':')[0],
      RepoTags: [name],
      Size: Math.floor(Math.random()*200+50)*1000000,
      Created: Date.now(),
      system: false
    });
    toast(t('toast.committed',{name}), 'success');
    addEvent('image', 'create', name, 'success');
    closeSheet();
  }

  // ─── Container Rename ───────────────────────────────────────────────────
  function renameContainer(id) {
    const c = state.containers.find(x=>x.Id===id);
    if (!c) return;
    const name = prompt(t('prompt.renameCtn'), trName(c.Names[0]));
    if (!name) return;
    c.Names = ['/'+name.trim()];
    toast(t('toast.renamed',{name}), 'success');
    renderCurrentView();
  }

  // ─── Image History ──────────────────────────────────────────────────────
  function showImageHistory(id) {
    const img = state.images.find(x=>x.Id===id);
    if (!img) return;
    const layers = [
      { id: 'sha256:'+Math.random().toString(36).slice(2,8), cmd: '/bin/sh -c #(nop) ADD file in /', size: '12 MB', when: '2 days ago' },
      { id: 'sha256:'+Math.random().toString(36).slice(2,8), cmd: '/bin/sh -c #(nop)  CMD ["node"]', size: '4 KB',  when: '2 days ago' },
      { id: 'sha256:'+Math.random().toString(36).slice(2,8), cmd: 'RUN apk add --no-cache python3', size: '2.1 MB', when: '3 days ago' },
      { id: 'sha256:'+Math.random().toString(36).slice(2,8), cmd: 'RUN apk add --no-cache nodejs', size: '5.4 MB', when: '3 days ago' },
      { id: 'sha256:'+Math.random().toString(36).slice(2,8), cmd: 'FROM node:20-slim', size: '4.4 MB', when: '3 days ago' },
    ];
    const rows = layers.map((l,i)=>`<tr${i%2===0?'':` style="background:var(--surface)"}`}>
      <td><span style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--accent)">${l.id}</span></td>
      <td><span style="font-size:var(--text-sm)">${esc(l.cmd)}</span></td>
      <td><span style="font-size:var(--text-sm);color:var(--muted)">${l.size}</span></td>
      <td><span style="font-size:var(--text-xs);color:var(--muted)">${l.when}</span></td>
    </tr>`).join('');
    openSheet(t('sheet.historyTitle',{name:img.RepoTags?.[0]||shortId(img.Id)}),
      `<table class="data-table"><thead><tr><th>${t('th.layer')}</th><th>${t('th.command')}</th><th>${t('common.size')}</th><th>${t('common.created')}</th></tr></thead><tbody>${rows}</tbody></table>`,
      '<button class="btn btn-secondary" onclick="closeSheet()">' + t('common.close') + '</button>'
    );
  }

  // ─── Image Tag ──────────────────────────────────────────────────────────
  function showTagImageSheet(imgId, currentTag) {
    const html = `<div class="form-group"><label class="form-label">${t('form.currentTag')}</label><input class="form-input" value="${esc(currentTag||'')}" readonly /></div>
      <div class="form-group"><label class="form-label">${t('form.newTag')}</label><input class="form-input" id="img-tag-input" placeholder="nginx:1.25-alpine" /></div>`;
    const footer = `<button class="btn btn-secondary" onclick="closeSheet()">${t('common.cancel')}</button><button class="btn btn-primary" onclick="tagImage('${esc(imgId)}')">${t('btn.tag')}</button>`;
    openSheet(t('sheet.tagImage'), html, footer);
  }
  function tagImage(imgId) {
    const input = document.getElementById('img-tag-input');
    if (!input || !input.value.trim()) return toast(t('toast.enterTag'),'error');
    const img = state.images.find(x=>x.Id===imgId);
    if (img && img.RepoTags) img.RepoTags.push(input.value.trim());
    toast(t('toast.tagged',{name:input.value}), 'success');
    addEvent('image', 'tag', input.value, 'success');
    closeSheet();
    renderCurrentView();
  }

  // ─── Nav ────────────────────────────────────────────────────────────────
  function updateNavCounts() {
    const r = state.containers.filter(c=>c.State==='running').length;
    document.getElementById('nav-containers-count').textContent = `${r}/${state.containers.length}`;
    document.getElementById('nav-images-count').textContent = state.images.length;
    document.getElementById('nav-stacks-count').textContent = state.stacks.length;
  }

  document.querySelectorAll('.nav-item').forEach(el => el.addEventListener('click', () => { navigateTo(el.dataset.route); closeSidebar(); }));

  document.getElementById('btn-refresh').addEventListener('click', refreshAll);

  // ─── Enhanced Search ───────────────────────────────────────────────────
  const searchInput = document.getElementById('global-search');
  const searchDropdown = document.getElementById('search-dropdown');
  let searchActiveIdx = -1;
  let searchResults = [];

  function searchAll(q) {
    const results = [];
    state.containers.forEach(c => {
      const name = trName(c.Names[0]);
      if (name.toLowerCase().includes(q) || c.Image.toLowerCase().includes(q) || shortId(c.Id).includes(q)) {
        results.push({ group: t('nav.containers'), name, meta: c.Image, route: 'containers', action: () => openContainerDetail(c.Id) });
      }
    });
    state.images.forEach(img => {
      const tag = img.RepoTags?.[0] || '';
      if (tag.toLowerCase().includes(q) || (img.Repository||'').toLowerCase().includes(q)) {
        results.push({ group: t('nav.images'), name: tag || shortId(img.Id), meta: formatBytes(img.Size), route: 'images' });
      }
    });
    state.volumes.forEach(v => {
      if (v.Name.toLowerCase().includes(q)) {
        results.push({ group: t('nav.volumes'), name: v.Name, meta: v.Usage, route: 'volumes' });
      }
    });
    state.stacks.forEach(s => {
      if (s.name.toLowerCase().includes(q)) {
        results.push({ group: t('nav.stacks'), name: s.name, meta: s.status, route: 'stacks', action: () => selectStack(s.id) });
      }
    });
    return results;
  }

  function renderSearchDropdown(results) {
    if (!results.length) { searchDropdown.classList.remove('open'); searchDropdown.innerHTML = ''; return; }
    const groups = {};
    results.forEach(r => { (groups[r.group] = groups[r.group] || []).push(r); });
    let html = '', idx = 0;
    for (const [group, items] of Object.entries(groups)) {
      html += `<div class="search-group"><div class="search-group-label">${esc(group)}</div>`;
      items.forEach(item => {
        html += `<div class="search-result-item" data-idx="${idx}" data-route="${item.route}">
          <span class="sr-name">${esc(item.name)}</span><span class="sr-meta">${esc(item.meta)}</span>
        </div>`;
        idx++;
      });
      html += '</div>';
    }
    searchDropdown.innerHTML = html;
    searchDropdown.classList.add('open');
    searchResults = results;
    searchActiveIdx = -1;
  }

  function highlightSearchItem(idx) {
    searchDropdown.querySelectorAll('.search-result-item').forEach(el => el.classList.remove('active'));
    if (idx >= 0 && idx < searchResults.length) {
      const el = searchDropdown.querySelector(`[data-idx="${idx}"]`);
      if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest' }); }
    }
    searchActiveIdx = idx;
  }

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) { searchDropdown.classList.remove('open'); searchResults = []; return; }
    renderSearchDropdown(searchAll(q));
  });

  searchInput.addEventListener('keydown', e => {
    const items = searchDropdown.querySelectorAll('.search-result-item');
    if (!items.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); highlightSearchItem(Math.min(searchActiveIdx + 1, items.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); highlightSearchItem(Math.max(searchActiveIdx - 1, 0)); }
    else if (e.key === 'Enter' && searchActiveIdx >= 0) {
      e.preventDefault();
      const r = searchResults[searchActiveIdx];
      if (r) {
        navigateTo(r.route);
        if (r.action) setTimeout(r.action, 80);
        searchDropdown.classList.remove('open');
        searchInput.value = '';
        searchInput.blur();
      }
    } else if (e.key === 'Escape') {
      searchDropdown.classList.remove('open');
      searchInput.blur();
    }
  });

  searchInput.addEventListener('blur', () => {
    setTimeout(() => searchDropdown.classList.remove('open'), 150);
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeSheet(); closeDialog(); }
    if ((e.metaKey||e.ctrlKey) && e.key==='k') { e.preventDefault(); document.getElementById('global-search')?.focus(); }
  });

  // ─── LiveFeed (simulated WebSocket) ────────────────────────────────────
  // 单一长连接事件源驱动 容器状态/事件流/仪表盘统计；系统自发变化不打扰用户（无 toast），
  // 只体现在数据与事件流中；用户主动操作的反馈才使用 toast。
  const liveFeed = {
    timer: null,
    start() { this.timer = setInterval(() => this.tick(), 6000); },
    tick() {
      if (Math.random() < 0.3) return; // 静默周期：长连接并非每拍都有事件
      const pool = state.containers.filter(c => !c.system && c.State === 'running');
      if (!pool.length) return;
      const c = pool[Math.floor(Math.random() * pool.length)];
      const name = trName(c.Names[0]);
      const roll = Math.random();
      if (roll < 0.6) {
        addEvent('container', 'health', name, 'success');
      } else if (roll < 0.9) {
        c.upHours = c.upHours || 1;
        addEvent('container', 'restart', name, 'success');
      } else {
        c.State = 'exited'; c.exitCode = 137; c.exitMinAgo = 1;
        addEvent('container', 'die', name, 'error');
      }
      updateNavCounts();
      renderCurrentView();
    },
  };
  liveFeed.start();

  // ─── Init ───────────────────────────────────────────────────────────────
  updateNavCounts();
  navigateTo('dashboard');
})();
  </script>
</body>
</html>
