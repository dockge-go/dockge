# Dockge 单机版：docker compose -f deploy/compose.yaml up -d --build
services:
  dockge:
    image: dockge-go:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: dockge
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../stacks:/opt/stacks
