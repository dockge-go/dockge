# 容器部署配置：数据（stacks 与数据库）集中在 /app/data，便于单卷挂载。
# JWT 密钥请通过 APP_SECURITY_JWT_KEY 环境变量覆盖，勿使用默认值上线。
env: prod
http:
  host: 0.0.0.0
  port: 5001
security:
  jwt:
    key: change-me-in-production
container:
  # 容器运行时 CLI：auto（默认，按 PATH 探测 docker → podman → nerdctl）或显式指定
  cli: auto
  # compose 命令：留空 = `<cli> compose`；独立命令（如 podman-compose）可直接填写
  compose: ""
dockge:
  stacks_dir: /opt/stacks
data:
  db:
    user:
      dsn: /app/data/dockge.db
log:
  log_level: info
  mode: both
  encoding: json
  log_file_name: /app/data/logs/dockge.log
  max_backups: 7
  max_age: 7
  max_size: 10
  compress: true
